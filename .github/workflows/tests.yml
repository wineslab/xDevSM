name: Unit Tests

on:
  pull_request:
    branches:
      - main
  # Also test `main` itself. Landing is fast-forward-only, so main normally receives exactly
  # the tree already tested on the PR — this is the safety net for a direct push or a
  # non-fast-forward merge, and it gates the tree that `tag-and-release.yml` publishes.
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect code changes
    if: github.repository != 'wineslab/xDevSM'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          # On push there is no base/head pair to diff (and after a force-push the previous
          # SHA may be unreachable), so always test: main is the tree that gets released.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push to main -> always test"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          echo "Changed files:"; git diff --name-only "$base..$head"
          noncode='(\.md$)|(^docs/)|(^\.github/)|(^LICENSE$)|(^CONTRIBUTORS$)|(^\.gitignore$)'
          if git diff --name-only "$base..$head" | grep -qvE "$noncode"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 only: ricsdl pins hiredis==2.0.0, whose setup.py imports the `imp` module
        # that CPython 3.12 removed, so the dependency tree cannot install on 3.12+.
        python-version: ["3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, with dev deps)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v
